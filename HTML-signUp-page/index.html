<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Create Account</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <div class="card">
                <div class="user-container">

                    <div class="user"></div>
                </div>
                
                <div class="gap">
                    <h2>Create a new account</h2>
                    <p class="subtitle">Enter your details to Sign up.</p>
                </div>
                <div class="form">

                    <form>
                        <div class="name">

                            <label>Full Name</label>
                            <input type="text" placeholder="Enter your name" />
                        </div>
                        <div class="dept">

                            <label>Department</label>
                            <input type="text" placeholder="Enter your department" />
                        </div>
                        
                        <div class="role">
                        <label>Role</label>
                            <div class="select">

                                <button type="button" class="role-btn">Employee</button>
                                <button type="button" class="role-btn">Support engineer</button>
                            </div>
                        </div>
                    </div>
                        
                    <button class="next-btn">Next</button>
                </form>
                <p class="login-text">Already have a account? <a href="#">Login</a></p>
            </div>
        </div>
        <div class="pattern">
        </div>
            
            
        </body>
        </html>
